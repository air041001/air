<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 绘图小屋</title>
<style>
  :root { --bg:#1a1b26; --panel:#24283b; --fg:#c0caf5; --dim:#565f89; --accent:#7aa2f7; --ok:#9ece6a; --err:#f7768e; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:16px; }
  .card { background:var(--panel); border-radius:12px; padding:20px; width:100%; max-width:640px; margin-bottom:16px; }
  h1 { font-size:1.3rem; margin-bottom:4px; }
  .sub { color:var(--dim); font-size:.85rem; margin-bottom:12px; }
  textarea { width:100%; min-height:90px; background:#1f2335; color:var(--fg); border:1px solid #3b4261; border-radius:8px; padding:10px; font-size:1rem; resize:vertical; }
  textarea:focus { outline:none; border-color:var(--accent); }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin:10px 0; }
  select, input[type=password], input[type=number] { background:#1f2335; color:var(--fg); border:1px solid #3b4261; border-radius:8px; padding:8px 10px; font-size:.95rem; }
  button { background:var(--accent); color:#1a1b26; border:none; border-radius:8px; padding:10px 22px; font-size:1rem; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  #status { margin-top:10px; font-size:.9rem; color:var(--dim); min-height:1.4em; }
  #status.err { color:var(--err); }
  #result { margin-top:12px; display:none; }
  #result img { width:100%; border-radius:8px; }
  #promptEn { font-size:.75rem; color:var(--dim); margin-top:6px; word-break:break-all; }
  .gallery { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; width:100%; max-width:640px; }
  .gallery img { width:100%; border-radius:8px; cursor:pointer; }
  .bar { height:4px; background:#1f2335; border-radius:2px; overflow:hidden; margin-top:8px; display:none; }
  .bar i { display:block; height:100%; width:40%; background:var(--accent); border-radius:2px; animation:slide 1.2s infinite; }
  @keyframes slide { 0%{margin-left:-40%} 100%{margin-left:100%} }
  a.dl { color:var(--accent); font-size:.85rem; text-decoration:none; }
</style>
</head>
<body>
  <div class="card">
    <h1>🎨 AI 绘图小屋</h1>
    <div class="sub">输入中文描述即可, 自动转成模型提示词 · 一次一张, 高峰期请耐心排队</div>
    <div class="row">
      <input type="password" id="token" placeholder="邀请码" style="flex:1">
      <button id="saveTok" type="button" style="padding:8px 14px">保存</button>
    </div>
    <textarea id="prompt" placeholder="例: 一个白发蓝眼睛的猫耳少女, 穿着白色连衣裙, 站在樱花树下, 微笑"></textarea>
    <div class="row">
      <select id="workflow"></select>
      <select id="size"></select>
    </div>
    <div class="row">
      <select id="lora" style="flex:1"><option value="">无 LoRA (原生模型)</option></select>
      <label for="lora-strength" style="color:var(--dim);font-size:.85rem">强度</label>
      <input id="lora-strength" type="number" min="0" max="1" step="0.05" value="1" title="LoRA 强度 (0~1, 1=满)" style="width:64px">
    </div>
    <div id="lora-preview" style="display:none;margin:6px 0 0">
      <img id="lora-img" alt="" onerror="this.style.display='none'" style="max-width:120px;border-radius:8px;vertical-align:middle">
      <span id="lora-desc" style="display:inline-block;margin-left:10px;font-size:.8rem;color:var(--dim);vertical-align:middle"></span>
    </div>
    <button id="go">✨ 生成</button>
    <div class="bar" id="bar"><i></i></div>
    <div id="status"></div>
    <div id="result">
      <img id="img" alt="生成结果">
      <div style="margin-top:6px;display:flex;justify-content:space-between;align-items:center">
        <span id="promptEn"></span>
        <a class="dl" id="dl" download>下载原图</a>
      </div>
    </div>
  </div>
  <div class="gallery" id="gallery"></div>

<script>
const $ = id => document.getElementById(id);
// ★ 域名已固定 (命名隧道, 永久不变). 不再读 localStorage 的 api_base --
//   临时隧道时代让访客自设 api_base 的兜底已废弃: 旧值会指向死掉的 trycloudflare 地址,
//   覆盖掉正确默认值, 导致 "Failed to fetch". 域名固定后访客无需也无法再覆盖.
const API = 'https://api.airpaint.xyz';
$('token').value = localStorage.getItem('token') || '';
$('saveTok').onclick = () => { localStorage.setItem('token', $('token').value.trim()); loadWorkflows(); loadLoras(); };

let workflows = [];
async function api(path, opts = {}) {
  opts.headers = Object.assign({ 'Authorization': 'Bearer ' + $('token').value.trim() }, opts.headers);
  if (opts.json) { opts.method = opts.method || 'POST'; opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(opts.json); }
  let r;
  try { r = await fetch(API + path, opts); }
  catch (e) { throw new Error('连不上服务器 ' + API + ' (网络问题, 或还在用旧地址 -- 请直接打开 https://airpaint.xyz)'); }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail || ('HTTP ' + r.status));
  return data;
}

async function loadWorkflows() {
  try {
    workflows = await api('/api/workflows');
    $('workflow').innerHTML = workflows.map(w => `<option value="${w.name}">${w.label}</option>`).join('');
    updateSizes();
    $('status').textContent = '';
  } catch (e) { $('status').textContent = '⚠ ' + e.message; $('status').className = 'err'; }
}
function updateSizes() {
  const w = workflows.find(x => x.name === $('workflow').value);
  $('size').innerHTML = (w && w.sizes ? w.sizes : ['']).map(s => `<option>${s}</option>`).join('');
  $('size').style.display = w && w.sizes ? '' : 'none';
}
$('workflow').onchange = updateSizes;

let loras = [];
async function loadLoras() {
  try {
    loras = await api('/api/loras');
    $('lora').innerHTML = '<option value="">无 LoRA (原生模型)</option>' +
      loras.map(l => `<option value="${l.key}">${l.name}</option>`).join('');
  } catch (e) { /* LoRA 可选, 拉不到不影响基础出图 */ }
}
function updateLoraPreview() {
  const l = loras.find(x => x.key === $('lora').value);
  const box = $('lora-preview');
  if (!l) { box.style.display = 'none'; return; }
  $('lora-desc').textContent = l.description || '';
  if (l.preview) { $('lora-img').src = l.preview; $('lora-img').style.display = ''; }
  else { $('lora-img').style.display = 'none'; $('lora-img').removeAttribute('src'); }
  box.style.display = (l.preview || l.description) ? '' : 'none';
}
$('lora').onchange = updateLoraPreview;

let polling = null;
$('go').onclick = async () => {
  const prompt = $('prompt').value.trim();
  if (!prompt) return;
  $('go').disabled = true; $('result').style.display = 'none';
  $('bar').style.display = 'block'; $('status').className = '';
  clearInterval(polling);
  try {
    const body = { workflow: $('workflow').value, prompt, size: $('size').value || undefined, lora: $('lora').value || undefined };
    if (body.lora) { const s = parseFloat($('lora-strength').value); if (!isNaN(s)) body.strength = s; }
    const job = await api('/api/jobs', { json: body });
    $('promptEn').textContent = '→ ' + job.prompt_en;
    polling = setInterval(() => poll(job.id), 2000);
  } catch (e) { done('⚠ ' + e.message, true); }
};

async function poll(id) {
  try {
    const j = await api('/api/jobs/' + id);
    if (j.status === 'queued') $('status').textContent = `排队中… 第 ${j.position} 位`;
    else if (j.status === 'running') $('status').textContent = '生成中… (通常 10~60 秒)';
    else if (j.status === 'done') {
      clearInterval(polling);
      $('img').src = API + j.image;
      $('dl').href = API + j.image;
      $('result').style.display = 'block';
      addToGallery(API + j.image);
      done('✅ 完成');
    } else if (j.status === 'failed') { clearInterval(polling); done('❌ ' + (j.error || '生成失败'), true); }
  } catch (e) { /* 网络抖动继续轮询 */ }
}
function done(msg, err) { $('status').textContent = msg; $('status').className = err ? 'err' : ''; $('bar').style.display = 'none'; $('go').disabled = false; }

function addToGallery(src) {
  const img = document.createElement('img'); img.src = src; img.onclick = () => window.open(src);
  $('gallery').prepend(img);
  while ($('gallery').children.length > 12) $('gallery').lastChild.remove();
}
loadWorkflows();
loadLoras();
</script>
</body>
</html>
