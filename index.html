<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>air 的绘图小屋</title>
<style>
  :root {
    --bg: #0f0e17;
    --panel: #1a1926;
    --panel-2: #232130;
    --fg: #eae7f5;
    --dim: #8b87a3;
    --accent: #ff8ba7;
    --accent-2: #7f5af0;
    --ok: #2cb67d;
    --err: #ff6b6b;
    --border: #2e2a40;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    background-image:
      radial-gradient(at 20% 0%, rgba(127, 90, 240, .08) 0, transparent 50%),
      radial-gradient(at 80% 100%, rgba(255, 139, 167, .06) 0, transparent 50%);
    color: var(--fg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
  }
  .wrap { width: 100%; max-width: 680px; }
  .header {
    text-align: center;
    margin-bottom: 28px;
    padding: 20px 0 8px;
  }
  .header h1 {
    font-size: 1.6rem;
    font-weight: 700;
    letter-spacing: .5px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 6px;
  }
  .header .sub {
    color: var(--dim);
    font-size: .85rem;
    letter-spacing: .3px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 20px;
    box-shadow: 0 4px 24px rgba(0, 0, 0, .25);
  }
  .row { display: flex; gap: 10px; flex-wrap: wrap; margin: 12px 0; align-items: center; }
  .row.tight { margin: 8px 0; }
  label {
    color: var(--dim);
    font-size: .82rem;
    white-space: nowrap;
  }
  textarea, select, input[type=password], input[type=number] {
    background: var(--panel-2);
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: .95rem;
    transition: border-color .2s, box-shadow .2s;
  }
  textarea:focus, select:focus, input:focus {
    outline: none;
    border-color: var(--accent-2);
    box-shadow: 0 0 0 3px rgba(127, 90, 240, .12);
  }
  textarea {
    width: 100%;
    min-height: 100px;
    resize: vertical;
    line-height: 1.6;
  }
  select { cursor: pointer; }
  input[type=password] { flex: 1; }
  input[type=number] { width: 72px; text-align: center; }
  .btn {
    border: none;
    border-radius: 10px;
    padding: 12px 24px;
    font-size: .95rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform .15s, box-shadow .2s, opacity .2s;
    letter-spacing: .3px;
  }
  .btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(0, 0, 0, .3); }
  .btn:active:not(:disabled) { transform: translateY(0); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
  }
  .btn-outline {
    background: transparent;
    color: var(--accent-2);
    border: 1.5px solid var(--accent-2);
  }
  .btn-ghost {
    background: transparent;
    color: var(--dim);
    border: 1px solid var(--border);
  }
  .btn-sm { padding: 8px 16px; font-size: .88rem; }
  .btn-flex { flex: 1; }
  #status {
    margin-top: 12px;
    font-size: .88rem;
    color: var(--dim);
    min-height: 1.4em;
    text-align: center;
  }
  #status.err { color: var(--err); }
  #result {
    margin-top: 16px;
    display: none;
    animation: fadeIn .4s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  #result img {
    width: 100%;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, .3);
  }
  .prompt-en-box {
    background: var(--panel-2);
    border-radius: 8px;
    padding: 10px 12px;
    margin-top: 10px;
    font-size: .78rem;
    color: var(--dim);
    word-break: break-all;
    line-height: 1.5;
  }
  .prompt-en-box strong { color: var(--accent); font-weight: 500; }
  .result-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 10px;
  }
  a.dl {
    color: var(--accent-2);
    font-size: .85rem;
    text-decoration: none;
    padding: 6px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    transition: background .2s, border-color .2s;
  }
  a.dl:hover { background: var(--panel-2); border-color: var(--accent-2); }
  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 10px;
    width: 100%;
    max-width: 680px;
  }
  .gallery img {
    width: 100%;
    border-radius: 10px;
    cursor: pointer;
    transition: transform .2s, box-shadow .2s;
    border: 1px solid var(--border);
  }
  .gallery img:hover { transform: scale(1.03); box-shadow: 0 4px 16px rgba(0, 0, 0, .3); }
  .bar {
    height: 3px;
    background: var(--panel-2);
    border-radius: 2px;
    overflow: hidden;
    margin-top: 12px;
    display: none;
  }
  .bar i {
    display: block;
    height: 100%;
    width: 35%;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    border-radius: 2px;
    animation: slide 1.4s ease-in-out infinite;
  }
  @keyframes slide { 0% { margin-left: -35%; } 100% { margin-left: 100%; } }
  .lora-preview-box {
    display: none;
    margin-top: 10px;
    padding: 12px;
    background: var(--panel-2);
    border-radius: 10px;
    border: 1px solid var(--border);
  }
  .lora-preview-box img {
    max-width: 100px;
    border-radius: 8px;
    vertical-align: middle;
    margin-right: 12px;
  }
  .lora-preview-box span {
    display: inline-block;
    font-size: .82rem;
    color: var(--dim);
    vertical-align: middle;
    line-height: 1.5;
  }
  .translate-preview {
    display: none;
    margin-top: 12px;
    animation: fadeIn .3s ease;
  }
  .translate-preview textarea { min-height: 80px; font-size: .88rem; }
  .token-row { display: flex; gap: 10px; align-items: center; }
  .token-row .btn { white-space: nowrap; }
  .hint {
    font-size: .78rem;
    color: var(--dim);
    margin-top: 6px;
    line-height: 1.5;
  }
  .hint code {
    background: var(--panel-2);
    padding: 2px 6px;
    border-radius: 4px;
    font-family: "SF Mono", Consolas, monospace;
    font-size: .75rem;
  }
  .footer {
    text-align: center;
    margin-top: 32px;
    padding: 16px;
    color: var(--dim);
    font-size: .75rem;
    letter-spacing: .3px;
  }
  .footer a { color: var(--accent-2); text-decoration: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>air 的绘图小屋</h1>
    <div class="sub">说中文，自动变成模型听得懂的提示词</div>
  </div>

  <div class="card">
    <div class="token-row">
      <input type="password" id="token" placeholder="输入邀请码">
      <button id="saveTok" type="button" class="btn btn-ghost btn-sm">保存</button>
    </div>

    <div style="margin-top: 16px;">
      <textarea id="prompt" placeholder="例：一个白发蓝眼睛的猫耳少女，穿着白色连衣裙，站在樱花树下，微笑"></textarea>
    </div>

    <div class="row tight">
      <select id="workflow"></select>
      <select id="size"></select>
    </div>

    <div class="row tight">
      <select id="lora" style="flex:1"><option value="">无 LoRA（原生模型）</option></select>
      <label for="lora-strength">强度</label>
      <input id="lora-strength" type="number" min="0" max="1" step="0.05" value="1" title="LoRA 强度 (0~1, 1=满)">
    </div>

    <div id="lora-preview" class="lora-preview-box">
      <img id="lora-img" alt="" onerror="this.style.display='none'">
      <span id="lora-desc"></span>
    </div>

    <div class="row" style="margin-top: 16px;">
      <button id="go" class="btn btn-primary btn-flex">✨ 直接生成</button>
      <button id="preview" type="button" class="btn btn-outline btn-flex">🔍 先看看翻译</button>
    </div>

    <div id="translate-preview" class="translate-preview">
      <textarea id="promptEnEdit" placeholder="翻译结果（可编辑后再生成）"></textarea>
      <div class="row" style="margin-top: 10px;">
        <button id="confirm" type="button" class="btn btn-primary btn-flex">✨ 确认生成</button>
        <button id="editCancel" type="button" class="btn btn-ghost">取消</button>
      </div>
      <div class="hint">
        翻译结果可以直接改，比如删掉不想要的 tag、调整顺序、加权重 <code>(tag:1.5)</code>
      </div>
    </div>

    <div class="bar" id="bar"><i></i></div>
    <div id="status"></div>

    <div id="result">
      <img id="img" alt="生成结果">
      <div class="prompt-en-box" id="promptEn"></div>
      <div class="result-footer">
        <span></span>
        <a class="dl" id="dl" download>下载原图</a>
      </div>
    </div>
  </div>

  <div class="gallery" id="gallery"></div>

  <div class="footer">
    airpaint.xyz · 用中文画出想法
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const API = 'https://api.airpaint.xyz';
$('token').value = localStorage.getItem('token') || '';
$('saveTok').onclick = () => { localStorage.setItem('token', $('token').value.trim()); loadWorkflows(); loadLoras(); };

let workflows = [];
async function api(path, opts = {}) {
  opts.headers = Object.assign({ 'Authorization': 'Bearer ' + $('token').value.trim() }, opts.headers);
  if (opts.json) { opts.method = opts.method || 'POST'; opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(opts.json); }
  let r;
  try { r = await fetch(API + path, opts); }
  catch (e) { throw new Error('连不上服务器 ' + API + '（网络问题，或还在用旧地址——请直接打开 https://airpaint.xyz）'); }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail || ('HTTP ' + r.status));
  return data;
}

async function loadWorkflows() {
  try {
    workflows = await api('/api/workflows');
    $('workflow').innerHTML = workflows.map(w => `<option value="${w.name}">${w.label}</option>`).join('');
    updateSizes();
    $('status').textContent = '';
  } catch (e) { $('status').textContent = '⚠ ' + e.message; $('status').className = 'err'; }
}
function updateSizes() {
  const w = workflows.find(x => x.name === $('workflow').value);
  $('size').innerHTML = (w && w.sizes ? w.sizes : ['']).map(s => `<option>${s}</option>`).join('');
  $('size').style.display = w && w.sizes ? '' : 'none';
}
$('workflow').onchange = updateSizes;

let loras = [];
async function loadLoras() {
  try {
    loras = await api('/api/loras');
    $('lora').innerHTML = '<option value="">无 LoRA（原生模型）</option>' +
      loras.map(l => `<option value="${l.key}">${l.name}</option>`).join('');
  } catch (e) { /* LoRA 可选，拉不到不影响基础出图 */ }
}
function updateLoraPreview() {
  const l = loras.find(x => x.key === $('lora').value);
  const box = $('lora-preview');
  if (!l) { box.style.display = 'none'; return; }
  $('lora-desc').textContent = l.description || '';
  if (l.preview) { $('lora-img').src = l.preview; $('lora-img').style.display = ''; }
  else { $('lora-img').style.display = 'none'; $('lora-img').removeAttribute('src'); }
  box.style.display = (l.preview || l.description) ? 'block' : 'none';
}
$('lora').onchange = updateLoraPreview;

let polling = null;
const ACTION_BTNS = ['go', 'preview', 'confirm'];
function setBusy(b) { ACTION_BTNS.forEach(id => $(id).disabled = b); }
function jobsBody(promptEn, promptRaw) {
  const body = { workflow: $('workflow').value, prompt_en: promptEn, prompt: promptRaw, size: $('size').value || undefined, lora: $('lora').value || undefined };
  if (body.lora) { const s = parseFloat($('lora-strength').value); if (!isNaN(s)) body.strength = s; }
  return body;
}
async function doTranslate() {
  return (await api('/api/translate', { json: { prompt: $('prompt').value.trim() } })).prompt_en;
}
async function submitJob(promptEn, promptRaw) {
  const job = await api('/api/jobs', { json: jobsBody(promptEn, promptRaw) });
  $('promptEn').innerHTML = '<strong>提示词：</strong>' + job.prompt_en;
  $('status').textContent = '已提交，排队中…';
  polling = setInterval(() => poll(job.id), 2000);
}

$('go').onclick = async () => {
  const prompt = $('prompt').value.trim();
  if (!prompt) return;
  $('result').style.display = 'none'; $('translate-preview').style.display = 'none';
  $('bar').style.display = 'block'; $('status').className = ''; $('status').textContent = '翻译中…';
  clearInterval(polling); setBusy(true);
  try { const en = await doTranslate(); await submitJob(en, prompt); }
  catch (e) { done('⚠ ' + e.message, true); }
};

$('preview').onclick = async () => {
  const prompt = $('prompt').value.trim();
  if (!prompt) return;
  $('bar').style.display = 'block'; $('status').className = ''; $('status').textContent = '翻译中…';
  clearInterval(polling); setBusy(true);
  try {
    const en = await doTranslate();
    $('promptEnEdit').value = en;
    $('translate-preview').style.display = 'block';
    $('bar').style.display = 'none';
    $('status').textContent = '可以编辑上面的翻译结果，再点确认生成';
    setBusy(false);
  } catch (e) { done('⚠ ' + e.message, true); }
};
$('confirm').onclick = async () => {
  const en = ($('promptEnEdit').value || '').trim();
  if (!en) return;
  const prompt = $('prompt').value.trim();
  $('result').style.display = 'none'; $('translate-preview').style.display = 'none';
  $('bar').style.display = 'block'; $('status').className = ''; $('status').textContent = '提交中…';
  clearInterval(polling); setBusy(true);
  try { await submitJob(en, prompt); }
  catch (e) { done('⚠ ' + e.message, true); }
};
$('editCancel').onclick = () => { $('translate-preview').style.display = 'none'; $('bar').style.display = 'none'; $('status').textContent = ''; setBusy(false); };

async function poll(id) {
  try {
    const j = await api('/api/jobs/' + id);
    if (j.status === 'queued') $('status').textContent = `排队中… 第 ${j.position} 位`;
    else if (j.status === 'running') $('status').textContent = '生成中…（通常 10~60 秒）';
    else if (j.status === 'done') {
      clearInterval(polling);
      $('img').src = API + j.image;
      $('dl').href = API + j.image;
      $('result').style.display = 'block';
      addToGallery(API + j.image);
      done('✅ 完成');
    } else if (j.status === 'failed') { clearInterval(polling); done('❌ ' + (j.error || '生成失败'), true); }
  } catch (e) { /* 网络抖动继续轮询 */ }
}
function done(msg, err) { $('status').textContent = msg; $('status').className = err ? 'err' : ''; $('bar').style.display = 'none'; setBusy(false); }

function addToGallery(src) {
  const img = document.createElement('img'); img.src = src; img.onclick = () => window.open(src);
  $('gallery').prepend(img);
  while ($('gallery').children.length > 12) $('gallery').lastChild.remove();
}
loadWorkflows();
loadLoras();
</script>
</body>
</html>
